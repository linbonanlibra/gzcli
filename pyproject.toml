[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clihub"
version = "0.1.0"
description = "CLIHub: 一个父指令统一网关，将团队 HTTP 接口以子指令方式对外提供"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
gzcli = "clihub.cli:main"

[tool.setuptools.packages.find]
include = ["clihub*"]
